<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" type="text/css" href="style.css" />
  <title>Merwede Utrecht 10kV Grid Dashboard</title>
</head>
<body>
  <h1>Merwede Utrecht Grid Dashboard</h1>
  <h2>Simulation controls</h2>

  <p><b>Simulation status:</b> <span id="run_state">Loading...</span></p>
  <p>
    <button id="runBtn" class="stopped">Run</button>
    <label for="slider">Simulation speed: <span id="speedslider_value">128</span></label>
    <input type="range" id="runspeed_slider" min="0" max="255" value="128">
  </p>

  <h2>Load controls</h2>
  <h2>Environment controls</h2>

  <script>

    const runBtn = document.getElementById('runBtn');

    const speed_slider = document.getElementById('runspeed_slider');
    const slider_valuedisplay = document.getElementById('speedslider_value');

    runBtn.addEventListener('click', async function () {
      // Just send the opposite of current state
      const desiredState = runBtn.classList.contains('running') ? 'stop' : 'run';
      await playPauze(desiredState); // This also calls updateStates()
    });

    speed_slider.addEventListener('change', async function () {
      const value = speed_slider.value;
      slider_valuedisplay.textContent = value;
      
      try {
        await fetch(`/set_value?value=${value}`);  
      } catch (e) {
        console.error("Failed to send slider value:", e);
      }
    });

    async function updateStates() {
      try {
        const res = await fetch('/gpio');
        const data = await res.json();

        document.getElementById('run_state').textContent = data["runState"];

        if (data["runState"] == "Running") {
          runBtn.textContent = 'Stop';
          runBtn.classList.remove('stopped');
          runBtn.classList.add('running');
        } else {
          runBtn.textContent = 'Run';
          runBtn.classList.remove('running');
          runBtn.classList.add('stopped');
        }

      } catch (e) {
        console.error("Error fetching GPIO states:", e);
      }
    }

    async function setGPIO(pin, state) {
      try {
        await fetch(`/${pin}/${state}`);   // send command to ESP32
        await updateStates();              // then update state display
      } catch (e) {
        console.error("Failed to set GPIO:", e);
      }
    }

    async function playPauze(state) {
      try {
        await fetch(`/run_state/${state}`);   // send command to ESP32
        await updateStates();              // then update state display
      } catch (e) {
        console.error("Failed to play/pauze:", e);
      }
    }

    // Initial and periodic update
    updateStates();
    setInterval(updateStates, 500);
  </script>
</body>
</html>
