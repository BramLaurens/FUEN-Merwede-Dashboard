<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" type="text/css" href="style.css" />
  <title>Merwede Utrecht 10kV Grid Dashboard</title>
</head>
<body>
  <h1>Merwede Utrecht</h1>
  <h1>Grid Dashboard</h1>

  <p>Simulation status: <span id="run_state">Loading...</span></p>
  <p>
    <button class="button" onclick="playPauze('run')">RUN</button>
    <button class="button button2" onclick="playPauze('stop')">STOP</button>
  </p>

  <script>
    async function updateStates() {
      try {
        const res = await fetch('/gpio');
        const data = await res.json();
        document.getElementById('state2').textContent = data["2"];
        document.getElementById('state27').textContent = data["27"];
        document.getElementById('run_state').textContent = data["runState"];
      } catch (e) {
        console.error("Error fetching GPIO states:", e);
      }
    }

    async function setGPIO(pin, state) {
      try {
        await fetch(`/${pin}/${state}`);   // send command to ESP32
        await updateStates();              // then update state display
      } catch (e) {
        console.error("Failed to set GPIO:", e);
      }
    }

    async function playPauze(state) {
      try {
        await fetch(`/run_state/${state}`);   // send command to ESP32
        await updateStates();              // then update state display
      } catch (e) {
        console.error("Failed to play/pauze:", e);
      }
    }

    // Initial and periodic update
    updateStates();
    setInterval(updateStates, 500);
  </script>
</body>
</html>
