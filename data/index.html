<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" type="text/css" href="style.css" />
  <title>Merwede Utrecht 10kV Grid Dashboard</title>
</head>
<body>
  <h1><span id="title">Merwede Utrecht Grid Dashboard   </span></h1>
  <h2>Simulation controls</h2>

  <p><b>Simulation status:</b> <span id="run_state">Loading...</span></p>
  <p>
    <button id="runBtn" class="stopped">Run</button>
    <label for="slider"><b>Simulation speed:</b> <span id="speedslider_value">128</span></label>
    <input type="range" id="runspeed_slider" min="0" max="255" value="128">
  </p>

  <h2>Load controls</h2>
  <p>
    <button id="pvBtn" class="pvoff">PV On</button>
    <button id="windBtn" class="windoff">Wind On</button>
    <button id="evBtn" class="evoff">EV On</button>
    <button id="hpBtn" class="hpoff">Heat Pump On</button>
    <button id="battBtn" class="battoff">Battery On</button>
  </p>
  <h2>Simulation parameters</h2>
  <h3 id="currentHour">00:00</h3>

  <script>

    const runBtn = document.getElementById('runBtn');
    const pvBtn = document.getElementById('pvBtn');
    const windBtn = document.getElementById('windBtn');
    const evBtn = document.getElementById('evBtn');
    const hpBtn = document.getElementById('hpBtn'); // Heat Pump button, not used in this example
    const battBtn = document.getElementById('battBtn');

    const speed_slider = document.getElementById('runspeed_slider');
    const slider_valuedisplay = document.getElementById('speedslider_value');

    runBtn.addEventListener('click', async function () {
      const desiredState = runBtn.classList.contains('running') ? 'stop' : 'run';
      await playPauze(desiredState); // This also calls updateStates()
    });

    pvBtn.addEventListener('click', async function () {
      const desiredState = pvBtn.classList.contains('pvon') ? 'off' : 'on';
      await pvClick(desiredState); // This also calls updateStates()
    });

    windBtn.addEventListener('click', async function () {
      const desiredState = windBtn.classList.contains('windon') ? 'off' : 'on';
      await windClick(desiredState); // This also calls updateStates()
    });

    evBtn.addEventListener('click', async function () {
      const desiredState = evBtn.classList.contains('evon') ? 'off' : 'on';
      await evClick(desiredState); // This also calls updateStates()
    });

    hpBtn.addEventListener('click', async function () {
      const desiredState = hpBtn.classList.contains('hpon') ? 'off' : 'on';
      await hpClick(desiredState); // This also calls updateStates()
    });

    battBtn.addEventListener('click', async function () {
      const desiredState = battBtn.classList.contains('batton') ? 'off' : 'on';
      await battClick(desiredState); // This also calls updateStates()
    });

    speed_slider.addEventListener('change', async function () {
      const value = speed_slider.value;
      slider_valuedisplay.textContent = value;
      
      try {
        await fetch(`/set_value?value=${value}`);  
      } catch (e) {
        console.error("Failed to send slider value:", e);
      }
    });

    async function updateStates() {
      try {
        const res = await fetch('/gpio');
        const data = await res.json();
        const currentHour = document.getElementById('currentHour');

        document.getElementById('run_state').textContent = data["runState"];

        currentHour.textContent = data["currentHour"];

        if (data["runState"] == "Running") {
          runBtn.textContent = 'Stop';
          runBtn.classList.remove('stopped');
          runBtn.classList.add('running');
        } else {
          runBtn.textContent = 'Run';
          runBtn.classList.remove('running');
          runBtn.classList.add('stopped');
        }

        if (data["pvState"] == "On") {
          pvBtn.textContent = 'PV Off';
          pvBtn.classList.remove('pvoff');
          pvBtn.classList.add('pvon');
        } else {
          pvBtn.textContent = 'PV On';
          pvBtn.classList.remove('pvon');
          pvBtn.classList.add('pvoff');
        }

        if (data["windState"] == "On") {
          windBtn.textContent = 'Wind Off';
          windBtn.classList.remove('windoff');
          windBtn.classList.add('windon');
        } else {
          windBtn.textContent = 'Wind On';
          windBtn.classList.remove('windon');
          windBtn.classList.add('windoff');
        }

        if (data["evState"] == "On") {
          evBtn.textContent = 'EV Off';
          evBtn.classList.remove('evoff');
          evBtn.classList.add('evon');
        } else {
          evBtn.textContent = 'EV On';
          evBtn.classList.remove('evon');
          evBtn.classList.add('evoff');
        }

        if (data["hpState"] == "On") {
          hpBtn.textContent = 'Heat Pump Off';
          hpBtn.classList.remove('hpoff');
          hpBtn.classList.add('hpon');
        } else {
          hpBtn.textContent = 'Heat Pump On';
          hpBtn.classList.remove('hpon');
          hpBtn.classList.add('hpoff');
        }

        if (data["battState"] == "On") {
          battBtn.textContent = 'Battery Off';
          battBtn.classList.remove('battoff');
          battBtn.classList.add('batton');
        } else {
          battBtn.textContent = 'Battery On';
          battBtn.classList.remove('batton');
          battBtn.classList.add('battoff');
        }

      } catch (e) {
        console.error("Error fetching GPIO states:", e);
      }
    }

    async function playPauze(state) {
      try {
        await fetch(`/run_state/${state}`);   // send command to ESP32
        await updateStates();              // then update state display
      } catch (e) {
        console.error("Failed to play/pauze:", e);
      }
    }

    async function pvClick(state) {
      try {
        await fetch(`/pv/${state}`);   // send command to ESP32
        await updateStates();              // then update state display
      } catch (e) {
        console.error("Failed to change pv state:", e);
      }
    }

    async function windClick(state) {
      try {
        await fetch(`/wind/${state}`);   // send command to ESP32
        await updateStates();              // then update state display
      } catch (e) {
        console.error("Failed to change wind state:", e);
      }
    }

    async function evClick(state) {
      try {
        await fetch(`/ev/${state}`);   // send command to ESP32
        await updateStates();              // then update state display
      } catch (e) {
        console.error("Failed to change ev state:", e);
      }
    }

    async function hpClick(state) {
      try {
        await fetch(`/hp/${state}`);   // send command to ESP32
        await updateStates();              // then update state display
      } catch (e) {
        console.error("Failed to change hp state:", e);
      }
    }

    async function battClick(state) {
      try {
        await fetch(`/batt/${state}`);   // send command to ESP32
        await updateStates();              // then update state display
      } catch (e) {
        console.error("Failed to change batt state:", e);
      }
    }

    // Initial and periodic update
    updateStates();
    setInterval(updateStates, 500);
  </script>
</body>
</html>
